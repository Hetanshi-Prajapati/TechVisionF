services:
  - type: web
    name: techvision-api
    env: docker
    plan: free
    rootDir: signup
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /api/auth/login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: validate
      - key: PORT
        value: "8080"
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: AI_MODEL_URL
        fromService:
          type: web
          name: techvision-ai
          property: host

  - type: web
    name: techvision-ai
    env: python
    plan: free
    rootDir: "AI Model"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
