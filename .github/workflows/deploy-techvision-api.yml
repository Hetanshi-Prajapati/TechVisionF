name: Deploy techvision-api to Fly

on:
  push:
    branches: ["deploy/render-ai-split"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh
      - name: Deploy API to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          ~/.fly/bin/flyctl auth token "$FLY_API_TOKEN"
          cd signup
          ~/.fly/bin/flyctl deploy --config fly.toml --remote-only
