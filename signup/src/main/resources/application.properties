# spring.jpa.hibernate.ddl-auto=update
# # Controls how Hibernate handles database tables.
# # Meaning of update:
# # Creates tables if not present
# # Updates columns automatically
# # ❌ Does NOT delete data

# spring.jpa.show-sql=true
# #Prints SQL queries in console.

# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# # Tells Hibernate:
# # “Use MySQL-specific SQL syntax.”
# # 📌 Helps Hibernate generate correct SQL for MySQL.
# # ⚠️ If wrong dialect → SQL errors.

# server.port=8080

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

spring.config.import=optional:application-secret.properties

# Server
# server.port=8080
server.port=${PORT:8080}

# Database connect (default to in-memory H2 for easier deploys)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:signupdb;MODE=PostgreSQL;NON_KEYWORDS=YEAR;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
 
# Multipart limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Serve uploads folder

#spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
gemini.api.key=${GEMINI_API_KEY:}

#Forgot password, send mail to recover password
#Gmail SMTP (Simple mail Transfer protocol) Configuration

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
