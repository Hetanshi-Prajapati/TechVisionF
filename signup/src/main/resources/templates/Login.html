<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TechVision</title>

    <link rel="icon" type="image/jpeg" href="/images/LOGO.png">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>

        :root {

            /* Palette Colors sync with signup.html */

            --bg-page: #05070a;

            --primary: #3b82f6;

            --secondary: #22d3ee;

            --accent: #1d4ed8;

            --text-dim: #94a3b8;

            --glass-border: rgba(255, 255, 255, 0.1);

            --success: #10b981;

            --error: #f87171;

            --required: #ef4444;

        }



        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');



        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body {

            font-family: "Inter", sans-serif;

            background-color: var(--bg-page);

            color: white;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            /* justify-content: flex-start; */
            justify-content: center;

            align-items: center;

            padding: 40px 20px 0;

            overflow-x: hidden;

        }



        .container {

            position: relative;

            z-index: 10;

            width: 35%;

            max-width: 580px;

            padding: 20px;

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

        }



        .glass-card {

            width: 100%;

            background: linear-gradient(145deg, #0f172a 0%, #000000 100%);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(59, 130, 246, 0.3);

            padding: 40px;

            border-radius: 28px;

            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.9), 0 0 40px rgba(37, 99, 235, 0.1);

            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;

            animation: cardEntrance 0.8s ease-out;

        }
        .tagline { margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-options { margin: 12px 0 16px 0; }
        .divider { margin: 20px 0; }



        .glass-card:hover {

            transform: translateY(-8px);

            box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 1), 0 0 50px rgba(37, 99, 235, 0.2);

            border-color: var(--primary);

        }



        @keyframes cardEntrance {

            from {

                opacity: 0;

                transform: translateY(40px);

            }



            to {

                opacity: 1;

                transform: translateY(0);

            }

        }



        .header {

            text-align: center;

            margin-bottom: 32px;

        }



        h2 {

            font-size: 30px;

            font-weight: 800;

            color: white;

            margin-bottom: 8px;

        }



        .tagline {

            color: var(--text-dim);

            font-size: 15px;

        }



        .form-group {

            margin-bottom: 22px;

            position: relative;

        }



        label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #cbd5e1;

            margin-bottom: 8px;

            margin-left: 4px;

        }



        .required::after {

            content: " *";

            color: var(--required);

            font-weight: bold;

        }



        input {

            width: 100%;

            padding: 14px 18px;

            background: rgba(15, 23, 42, 0.6);

            border: 1px solid var(--glass-border);

            border-radius: 14px;

            color: white;

            font-size: 15px;

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            outline: none;

        }



        input:hover {

            border-color: rgba(59, 130, 246, 0.5);

            background: rgba(15, 23, 42, 0.8);

        }



        input:focus {

            background: #000;

            border-color: var(--primary);

            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);

            transform: translateY(-1px);

        }



        /* Autofill Styles Fix - ensures background stays dark and text stays white */

        input:-webkit-autofill,

        input:-webkit-autofill:hover,

        input:-webkit-autofill:focus,

        input:-webkit-autofill:active,

        input:autofill,

        input:autofill:hover,

        input:autofill:focus,

        input:autofill:active {

            -webkit-text-fill-color: white !important;

            -webkit-box-shadow: 0 0 0 1000px #0f172a inset !important;

            box-shadow: 0 0 0 1000px #0f172a inset !important;

            transition: background-color 600000s 0s, color 600000s 0s;

        }



        .error-message {

            color: var(--error);

            font-size: 12px;

            margin-top: 6px;

            display: none;

        }



        .error-message.show {

            display: block;

        }



        .form-options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 24px;

            font-size: 13px;

        }



        .remember-me {

            display: flex;

            align-items: center;

            gap: 8px;

            cursor: pointer;

            color: var(--text-dim);

        }



        .remember-me input {

            width: 16px;

            height: 16px;

            cursor: pointer;

            accent-color: var(--primary);

        }



        .forgot-password {

            color: var(--primary);

            text-decoration: none;

            font-weight: 600;

        }



        .forgot-password:hover {

            text-decoration: underline;

        }



        .submit-btn {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 16px;

            background: linear-gradient(135deg, #2563eb, #1e40af);

            color: white;

            font-weight: 700;

            font-size: 16px;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);

        }



        .submit-btn:hover:not(:disabled) {

            transform: translateY(-2px);

            filter: brightness(1.1);

            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.4);

        }



        .submit-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }



        .divider {

            display: flex;

            align-items: center;

            gap: 16px;

            margin: 32px 0;

            color: var(--text-dim);

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 1px;

        }



        .divider::before,

        .divider::after {

            content: '';

            flex: 1;

            height: 1px;

            background: var(--glass-border);

        }



        .social-btn {

            width: 100%;

            padding: 12px;

            background: rgba(255, 255, 255, 0.03);

            border: 1px solid var(--glass-border);

            border-radius: 12px;

            color: white;

            font-weight: 600;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin-bottom: 12px;

            cursor: pointer;

            transition: all 0.3s ease;

        }



        .social-btn:hover {

            background: rgba(255, 255, 255, 0.08);

            border-color: rgba(59, 130, 246, 0.3);

            transform: scale(1.02);

        }



        .social-btn img,

        .social-btn i {

            width: 20px;

            font-size: 20px;

        }



        .signup-link {

            text-align: center;

            margin-top: 24px;

            font-size: 14px;

            color: var(--text-dim);

        }



        .signup-link a {

            color: var(--primary);

            text-decoration: none;

            font-weight: 600;

        }



        .signup-link a:hover {

            text-decoration: underline;

        }



        /* Message Boxes sync with register's status box feel */

        .message-box {

            padding: 12px;

            border-radius: 10px;

            font-size: 14px;

            margin-bottom: 20px;

            display: none;

            text-align: center;

            animation: slideDown 0.3s ease;

        }



        @keyframes slideDown {

            from {

                opacity: 0;

                transform: translateY(-10px);

            }



            to {

                opacity: 1;

                transform: translateY(0);

            }

        }



        .error-box {

            background: rgba(239, 68, 68, 0.15);

            border: 1px solid rgba(239, 68, 68, 0.3);

            color: var(--error);

        }



        .success-box {

            background: rgba(16, 185, 129, 0.15);

            border: 1px solid rgba(16, 185, 129, 0.3);

            color: var(--success);

        }



        .password-container {

            position: relative;

        }



        .password-toggle {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            background: none;

            border: none;

            color: var(--text-dim);

            cursor: pointer;

            font-size: 18px;

            padding: 5px;

            transition: color 0.2s;

        }



        .password-toggle:hover {

            color: white;

        }







        .logo-container {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            text-decoration: none;

            margin-bottom: 24px;

            background: none;

            box-shadow: none;

            border: none;

        }



        .logo-box {

            display: flex;

            align-items: center;

            justify-content: center;

            background: transparent;

            box-shadow: none;

            border: none;

            flex-shrink: 0;

        }



        .logo-img {

            height: 70px;

            width: auto;

            object-fit: contain;

            background: none;

            box-shadow: none;

        }



        .logo-text {

            font-family: 'Space Grotesk', sans-serif;

            font-size: 28px;

            font-weight: 600;

            color: #EAEAEA;

        }

        .site-footer {

            width: 100%;

            padding: 18px 20px 24px;

            text-align: center;

            color: var(--text-dim);

            font-size: 14px;

            position: relative;

            z-index: 10;

        }

        .footer-links {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 18px;

            margin-bottom: 10px;

        }

        .footer-links a {

            color: #e2e8f0;

            text-decoration: none;

        }

        .footer-links a:hover {

            color: var(--secondary);

        }

    </style>

    <script src="/js/csrf.js"></script>
</head>



<body>

    <div class="container">

        <div class="glass-card">

            <div class="logo-container">

                <div class="logo-box">

                    <img src="/images/LOGO.png" alt="TechVision Logo" class="logo-img" style="height:70px;width:auto;object-fit:contain;vertical-align:middle;">

                </div>

                <span class="logo-text">TechVision</span>

            </div>

            <div class="header">

                <h2>Welcome Back</h2>

                <p class="tagline">Log in to your developer account</p>

            </div>



            <div id="statusBox" class="message-box"></div>



            <form id="loginForm">

                <div class="form-group">

                    <label for="email">Email or Username <span class="required"></span></label>

                    <input id="email" name="email" placeholder="Email or Username" required autocomplete="username">

                    <!--type="email"-->

                    <div class="error-message" id="emailError"></div>

                </div>



                <div class="form-group">

                    <label for="password">Password<span class="required"></span></label>

                    <div class="password-container">

                        <input type="password" id="password" name="password" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required

                            autocomplete="current-password">

                        <button type="button" class="password-toggle" id="togglePass" title="Show password">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                    <div class="error-message" id="passwordError"></div>

                </div>



                <div class="form-options">

                    <label class="remember-me">

                        <input type="checkbox" id="rememberMe" name="rememberMe">

                        Remember me

                    </label>

                    <a href="#" class="forgot-password" onclick="handleForgotPassword(event)">Forgot password?</a>

                </div>



                <button type="submit" class="submit-btn" id="submitBtn">Login</button>

            </form>



            <div class="divider">OR CONNECT WITH</div>



            <button type="button" class="social-btn" onclick="openOAuthPopup('google')">

                <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google">

                Continue with Google

            </button>



            <button type="button" class="social-btn" onclick="openOAuthPopup('github')">

                <i class="fa-brands fa-github"></i>

                Continue with GitHub

            </button>



            <div class="signup-link">

                Don't have an account? <a href="/api/auth/signup">Sign Up</a>

            </div>

        </div>

    </div>



    <footer class="site-footer">
        <div class="footer-links">
            <a href="/api/auth/about">About Us</a>
            <a href="/api/auth/contact">Contact Us</a>
            <a href="/api/auth/terms">Terms</a>
            <a href="/api/auth/privacy">Privacy</a>
        </div>
        <p>Â© 2026 TechVision. All rights reserved.</p>
    </footer>

    <script>

        const form = document.getElementById('loginForm');

        const emailInput = document.getElementById('email');

        const passwordInput = document.getElementById('password');

        const toggleBtn = document.getElementById('togglePass');

        const statusBox = document.getElementById('statusBox');



        // Toggle Password Visibility

        toggleBtn.addEventListener('click', () => {

            const isPass = passwordInput.type === 'password';

            passwordInput.type = isPass ? 'text' : 'password';



            // Switch icons and tooltip

            const icon = toggleBtn.querySelector('i');

            if (isPass) {

                icon.className = 'fa-solid fa-eye-slash';

                toggleBtn.title = 'Hide password';

            } else {

                icon.className = 'fa-solid fa-eye';

                toggleBtn.title = 'Show password';

            }

        });



        // Pre-initialize icons by creating them hidden to ensure they are loaded

        const preloader = document.createElement('div');

        preloader.style.cssText = 'height: 0; width: 0; position: absolute; overflow: hidden; opacity: 0;';

        preloader.innerHTML = '<i class="fa-solid fa-eye"></i><i class="fa-solid fa-eye-slash"></i>';

        document.body.appendChild(preloader);



        // Real-time validation

        function showError(errorId, message) {

            const error = document.getElementById(errorId);

            if (error) {

                error.textContent = message;

                error.classList.add('show');

            }

            return false;

        }



        function hideError(errorId) {

            const error = document.getElementById(errorId);

            if (error) {

                error.classList.remove('show');

            }

            return true;

        }



        function showStatus(msg, type) {

            statusBox.textContent = msg;

            statusBox.className = `message-box ${type === 'success' ? 'success-box' : 'error-box'}`;

            statusBox.style.display = 'block';

        }



        function validateIdentifier(value) {

            if (value.length >= 3) {

                return hideError('emailError');

            }

            return showError('emailError', 'Please enter your email or username');

        }



        function validatePassword(password) {

            if (password.length < 6) {

                return showError('passwordError', 'Password must be at least 6 characters long');

            }

            return hideError('passwordError');

        }



        // Form submission

        form.addEventListener('submit', (e) => {

            e.preventDefault();



            const idOk = validateIdentifier(emailInput.value.trim());

            const passOk = validatePassword(passwordInput.value);

            if (!idOk || !passOk) return;



            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;

            submitBtn.textContent = 'Verifying...';



            const loginData = {

                email: emailInput.value.trim(),

                password: passwordInput.value

            };

            const rememberMe = document.getElementById('rememberMe').checked;



            fetch('/api/auth/login', {

                method: 'POST',

                credentials: 'include',

                headers: {

                    'Content-Type': 'application/json',

                },

                body: JSON.stringify({ ...loginData, rememberMe })

            })

                .then(async response => {

                    const contentType = response.headers.get('content-type') || '';

                    const isJson = contentType.includes('application/json');

                    const payload = isJson

                        ? await response.json().catch(() => ({}))

                        : await response.text();



                    if (!response.ok) {

                        if (isJson) {

                            throw new Error(payload.message || 'Login failed');

                        }

                        throw new Error('Login failed. Please refresh and try again.');

                    }



                    if (!isJson) {

                        throw new Error('Unexpected server response. Please try again.');

                    }



                    return payload;

                })

                .then(data => {

                    if (data && data.id) {

                        showStatus('Login successful! Redirecting...', 'success');

                        if (rememberMe) {

                            localStorage.setItem('rememberMe', 'true');

                            localStorage.setItem('savedEmail', emailInput.value.trim());

                        } else {

                            localStorage.removeItem('rememberMe');

                            localStorage.removeItem('savedEmail');

                        }

                        localStorage.setItem('user', JSON.stringify({

                            id: data.id,

                            username: data.username || '',

                            email: data.email || '',

                            fullName: data.fullName || '',

                            bio: data.bio || '',

                            profilePic: data.profilePic || '',

                            primarySkill: data.primarySkill || '',

                            githubUsername: data.githubUsername || '',

                            isAdmin: data.isAdmin || false,

                            role: data.role || (data.isAdmin ? 'ADMIN' : 'USER')

                        }));

                        if (data.token) {

                            sessionStorage.setItem('authToken', data.token);

                        } else {

                            sessionStorage.removeItem('authToken');

                        }

                        setTimeout(() => {

                            if (data.isAdmin === true) {

                                window.location.href = '/admin';

                            } else {

                                window.location.href = '/home';

                            }

                        }, 1000);

                    } else {

                        showStatus(data.message || 'Login failed. Please try again.', 'error');

                        submitBtn.disabled = false;

                        submitBtn.textContent = 'Login';

                    }

                })

                .catch(error => {

                    console.error('Error:', error);

                    showStatus(error.message || 'Failed to connect to server.', 'error');

                    submitBtn.disabled = false;

                    submitBtn.textContent = 'Login';

                });

        });



        // Load saved email if remember me was checked and check if already logged in

        window.addEventListener('DOMContentLoaded', async function () {

            // Check if user just logged out - skip auto-login

            if (localStorage.getItem('justLoggedOut') === 'true') {

                localStorage.removeItem('justLoggedOut');

                return;

            }

            // 1. Check if already authenticated (auto-login)

            try {

                const res = await fetch('/api/auth/users/me', { credentials: 'include' });

                if (res.ok) {

                    const data = await res.json();

                    localStorage.setItem('user', JSON.stringify(data));

                    window.location.href = data.isAdmin === true ? '/admin' : '/home';

                    return;

                }

            } catch (e) { }



            // 2. Load saved email

            if (localStorage.getItem('rememberMe') === 'true') {

                const savedEmail = localStorage.getItem('savedEmail');

                if (savedEmail) {

                    emailInput.value = savedEmail;

                    document.getElementById('rememberMe').checked = true;

                }

            }

        });



        function openOAuthPopup(provider) {
            const width = 600;
            const height = 700;
            const left = window.screenX + Math.max(0, (window.outerWidth - width) / 2);
            const top = window.screenY + Math.max(0, (window.outerHeight - height) / 2);
            const url = `/api/auth/oauth2/start/${provider}`;
            const popup = window.open(url, `oauth_${provider}`, `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes,status=yes`);
            if (popup) {
                popup.focus();
            } else {
                alert('Popup blocked. Please allow pop-ups for this site to continue with Google or GitHub.');
            }
        }






        async function handleForgotPassword(e) {

            e.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {

                showStatus('Please enter your email address first.', 'error');

                emailInput.focus();

                return;

            }

            try {

                const res = await fetch('/api/auth/forgot', {

                    method: 'POST',

                    credentials: "include",

                    headers: { 'Content-Type': 'application/json' },

                    body: JSON.stringify({ email })

                });

                if (!res.ok) {

                    const data = await res.json().catch(() => ({}));

                    showStatus(data.message || 'Email not found.', 'error');

                    return;

                }

                const data = await res.json();

                showStatus(data.message || 'Reset link sent to your inbox (simulated in console).', 'success');

            } catch (e) {

                showStatus('Failed to start reset flow.', 'error');

            }

        }

    </script>

</body>
</html>
