<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | TechVision</title>

    <link rel="icon" type="image/jpeg" href="/images/LOGO.png">

    <style>

        :root {

            --bg-start: #0d1117;

            --bg-end: #0b0f14;

            --text: #e5e7eb;

            --text-dim: #9aa7b3;

            --card-bg: #12161c;

            --card-border: rgba(255, 255, 255, 0.08);

            --primary: #3b82f6;

        }



        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');



        body {

            margin: 0;

            padding: 0;

            font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

            color: var(--text);

            line-height: 1.7;

            background: radial-gradient(circle at top, var(--bg-start), var(--bg-end));

        }



        .navbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px 20px;

            background: rgba(255, 255, 255, 0.06);

            border-bottom: 1px solid rgba(255, 255, 255, 0.12);

        }



        .nav-brand {

            font-size: 22px;

            font-weight: 700;

            color: var(--text);

            text-decoration: none;

        }



        .main {

            max-width: 480px;

            margin: 24px auto;

            padding: 0 20px;

        }



        .card {

            background: var(--card-bg);

            border: 1px solid var(--card-border);

            border-radius: 16px;

            padding: 24px;

        }



        h1,

        h2,

        h3 {

            color: var(--text);

            font-weight: 700;

            line-height: 1.3;

            margin: 0 0 12px 0;

        }



        h2 {

            font-size: 24px;

        }



        p {

            color: var(--text-dim);

            line-height: 1.7;

            margin: 0 0 12px 0;

        }



        .form-group {

            margin-bottom: 16px;

        }



        label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            color: #cbd5e1;

            margin-bottom: 8px;

        }



        input {

            width: 100%;

            padding: 12px;

            border-radius: 10px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            background: rgba(255, 255, 255, 0.1);

            color: white;

            outline: none;

        }



        .btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: var(--primary);

            color: white;

            font-weight: 600;

            cursor: pointer;

            margin-top: 8px;

        }



        .btn:hover {

            filter: brightness(1.1);

        }



        .msg {

            display: none;

            padding: 10px;

            border-radius: 10px;

            margin-bottom: 12px;

            font-size: 14px;

            text-align: center;

        }



        .msg.success {

            display: none;

            background: rgba(16, 185, 129, 0.2);

            border: 1px solid rgba(16, 185, 129, 0.4);

            color: #10b981;

        }



        .msg.error {

            display: none;

            background: rgba(239, 68, 68, 0.2);

            border: 1px solid rgba(239, 68, 68, 0.4);

            color: #f87171;

        }



        .logo-container {

            position: absolute;

            top: 2rem;

            left: 2.5rem;

            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;

            z-index: 1000;

            background: none;

            box-shadow: none;

            border: none;

        }



        .logo-box {

            display: flex;

            align-items: center;

            justify-content: center;

            background: none;

            box-shadow: none;

            border: none;

        }



        .logo-img {

            height: 70px;

            width: auto;

            object-fit: contain;

            background: none;

            box-shadow: none;

        }



        .logo-text {

            font-family: 'Space Grotesk', sans-serif;

            font-size: 28px;

            font-weight: 600;

            color: #EAEAEA;

        }

    </style>

<body>

    <div class="logo-container">

        <div class="logo-box">

            <img src="/images/LOGO.png" alt="TechVision Logo" class="logo-img" style="height:70px;width:auto;object-fit:contain;vertical-align:middle;">

            <!-- <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">

                    <polyline points="16 18 22 12 16 6"></polyline>

                    <polyline points="8 6 2 12 8 18"></polyline>

                </svg> -->

        </div>

        <span class="logo-text">TechVision</span>

    </div>

    <!-- Removed redundant navbar -->

    <div class="main">

        <div class="card">

            <h2>Reset Password</h2>

            <div id="success" class="msg success">Password reset successful. Redirecting to login...</div>

            <div id="error" class="msg error">Invalid or expired token.</div>

            <div class="form-group">

                <input id="token" type="hidden">

            </div>

            <div class="form-group">

                <label>New Password</label>

                <input id="newPassword" type="password" placeholder="Enter new password">

            </div>

            <button class="btn" id="resetBtn">Reset Password</button>

        </div>

    </div>

    <script>

        function getParam(name) { try { const u = new URL(window.location.href); return u.searchParams.get(name) || ''; } catch (e) { return ''; } }

        const t = getParam('token'); if (t) document.getElementById('token').value = t;

        document.getElementById('resetBtn').addEventListener('click', async () => {

            const token = document.getElementById('token').value.trim();

            const newPassword = document.getElementById('newPassword').value.trim();

            const success = document.getElementById('success'), error = document.getElementById('error');

            success.style.display = 'none'; error.style.display = 'none';

            if (!token || !newPassword) { error.textContent = 'Enter token and new password'; error.style.display = 'block'; return; }

            try {

                const res = await fetch('/api/auth/reset', { method: 'POST', credentials: "include", headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, newPassword }) });

                if (!res.ok) { const d = await res.json().catch(() => ({})); error.textContent = d.message || 'Invalid or expired token'; error.style.display = 'block'; return; }

                success.style.display = 'block';

                setTimeout(() => window.location.replace('/api/auth/login'), 1200);

            } catch (e) { error.textContent = 'Failed to reset'; error.style.display = 'block'; }

        });

    </script>

</body>



</html>
