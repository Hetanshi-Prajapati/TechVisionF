<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="shortcut icon" href="/images/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        .status-badge.admin {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.user {
            background: #cfe2ff;
            color: #084298;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .loading {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #666;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            line-height: 1;
        }

        .stat-card.danger .stat-value {
            color: #f87171;
        }

        .stat-card.warning .stat-value {
            color: #fbbf24;
        }

        .stat-card.success .stat-value {
            color: #10b981;
        }

        .navigation {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .nav-button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .nav-button:hover {
            background: #764ba2;
        }

        .nav-button.active {
            background: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.5);
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .section.active {
            display: block;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table thead {
            background: #f8f9fa;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #dee2e6;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #dee2e6;
            color: #666;
        }

        table tbody tr:hover {
            background: #f8f9fa;
        }

        .action-button {
            padding: 6px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .action-button.delete {
            background: #f87171;
            color: white;
        }

        .action-button.delete:hover {
            background: #dc2626;
        }

        .action-button.primary {
            background: #667eea;
            color: white;
        }

        .action-button.primary:hover {
            background: #764ba2;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .empty-state p {
            font-size: 16px;
        }

        .pagination {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 12px;
            background: #f0f0f0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .badge.approved {
            background: #d1fae5;
            color: #065f46;
        }

        .badge.deleted {
            background: #fee2e2;
            color: #7f1d1d;
        }

        .code-block {
            background: #0d1117;
            color: #c9d1d9;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .navigation {
                flex-direction: column;
            }

            .nav-button {
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            table th,
            table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>👨‍💼 Admin Dashboard</h1>
            <p>Welcome to the admin control panel</p>
            <div id="auth-info"></div>
        </div>

        <!-- Error Display -->
        <div id="error-container"></div>

        <!-- Loading State -->
        <div id="loading-container" class="loading">
            <p>⏳ Loading dashboard data...</p>
        </div>

        <!-- Main Content (hidden until loaded) -->
        <div id="main-content" style="display: none;">
            <!-- Dashboard Stats -->
            <div class="dashboard" id="dashboard-stats"></div>

            <!-- Navigation -->
            <div class="navigation">
                <button class="nav-button active" onclick="showSection('overview')">📊 Overview</button>
                <button class="nav-button" onclick="showSection('users')">👥 Users</button>
                <button class="nav-button" onclick="showSection('posts')">📝 Posts</button>
                <button class="nav-button" onclick="showSection('reports')">🚩 Reports</button>
                <button class="nav-button" onclick="showSection('analytics')">📈 Analytics</button>
                <button class="nav-button" onclick="logout()">🚪 Logout</button>
            </div>

            <!-- Overview Section -->
            <div class="section active" id="overview">
                <h2>📊 Dashboard Overview</h2>
                <p>System statistics and quick access to admin functions.</p>
            </div>

            <!-- Users Section -->
            <div class="section" id="users">
                <h2>👥 User Management</h2>
                <div id="users-content"></div>
            </div>

            <!-- Posts Section -->
            <div class="section" id="posts">
                <h2>📝 Post Management</h2>
                <div id="posts-content"></div>
            </div>

            <!-- Reports Section -->
            <div class="section" id="reports">
                <h2>🚩 User Reports</h2>
                <div id="reports-content"></div>
            </div>

            <!-- Analytics Section -->
            <div class="section" id="analytics">
                <h2>📈 Analytics</h2>
                <div id="analytics-content"></div>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // Configuration
        // ========================================
        const API_BASE_URL = 'http://localhost:8080';
        const ITEMS_PER_PAGE = 10;

        // ========================================
        // State Management
        // ========================================
        let currentUser = null;
        let dashboardData = null;
        let currentSection = 'overview';
        let usersPagination = { page: 0, total: 0 };
        let postsPagination = { page: 0, total: 0 };

        function getAuthToken() {
            return sessionStorage.getItem('authToken') || localStorage.getItem('authToken') || '';
        }

        function authHeaders(extraHeaders = {}) {
            const headers = { ...extraHeaders };
            const token = getAuthToken();
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            return headers;
        }

        // ========================================
        // Initialize
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminDashboard();
        });

        // ========================================
        // Main Functions
        // ========================================

        async function loadAdminDashboard() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/dashboard`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: authHeaders({
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    })
                });

                if (response.status === 403) {
                    showError('❌ Access Denied', 'You do not have admin privileges. Please contact the administrator.');
                    return;
                }

                if (response.status === 401) {
                    showError('❌ Unauthorized', 'Please login first.');
                    redirectToLogin();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                dashboardData = data.dashboard;

                // Hide loading, show content
                document.getElementById('loading-container').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';

                // Render dashboard
                renderDashboard();
                renderAuthInfo();

            } catch (error) {
                console.error('Error loading dashboard:', error);
                showError('❌ Error', `Failed to load dashboard: ${error.message}`);
            }
        }

        function renderDashboard() {
            if (!dashboardData) return;

            const stats = [
                { title: 'Total Users', value: dashboardData.totalUsers, icon: '👥', className: 'success' },
                { title: 'Active Users', value: dashboardData.activeUsers, icon: '💚', className: 'success' },
                { title: 'Total Posts', value: dashboardData.totalPosts, icon: '📝', className: 'success' },
                { title: 'Pending Reports', value: dashboardData.pendingReports, icon: '🚩', className: 'danger' },
                { title: 'App Mode', value: dashboardData.appMode, icon: '⚙️', className: '' }
            ];

            const statsHtml = stats.map(stat => `
                <div class="stat-card ${stat.className}">
                    <h3>${stat.icon} ${stat.title}</h3>
                    <div class="stat-value">${stat.value}</div>
                </div>
            `).join('');

            document.getElementById('dashboard-stats').innerHTML = statsHtml;
        }

        function renderAuthInfo() {
            const info = document.getElementById('auth-info');
            info.innerHTML = `<span class="status-badge admin">✓ Logged in as Admin</span>`;
        }

        // ========================================
        // Section Navigation
        // ========================================

        function showSection(sectionName) {
            // Hide all sections
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));

            // Show selected section
            const section = document.getElementById(sectionName);
            if (section) {
                section.classList.add('active');
            }

            // Mark button as active
            event.target.classList.add('active');

            currentSection = sectionName;

            // Load section-specific data
            switch (sectionName) {
                case 'users':
                    loadUsers(0);
                    break;
                case 'posts':
                    loadPosts(0);
                    break;
                case 'reports':
                    loadReports();
                    break;
                case 'analytics':
                    loadAnalytics();
                    break;
            }
        }

        // ========================================
        // Users Section
        // ========================================

        async function loadUsers(page = 0) {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/admin/users?page=${page}&size=${ITEMS_PER_PAGE}`,
                    {
                        credentials: 'include',
                        headers: authHeaders({ 'Accept': 'application/json' })
                    }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                usersPagination.page = data.page;
                usersPagination.total = data.totalPages;

                let html = '<table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead><tbody>';

                data.users.forEach(user => {
                    const role = user.admin ? '👑 Admin' : '👤 User';
                    html += `<tr>
                        <td>${user.id}</td>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.email}</td>
                        <td>${role}</td>
                        <td>
                            <button class="action-button delete" onclick="deleteUser(${user.id})">Delete</button>
                        </td>
                    </tr>`;
                });

                html += '</tbody></table>';

                // Add pagination
                html += '<div class="pagination">';
                for (let i = 0; i < usersPagination.total; i++) {
                    const activeClass = i === usersPagination.page ? 'active' : '';
                    html += `<button class="${activeClass}" onclick="loadUsers(${i})">${i + 1}</button>`;
                }
                html += '</div>';

                document.getElementById('users-content').innerHTML = html;

            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('users-content').innerHTML = 
                    `<div class="error-message">Error loading users: ${error.message}</div>`;
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    credentials: 'include',
                    headers: authHeaders({ 'Content-Type': 'application/json' })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                alert('✅ User deleted successfully');
                loadUsers(usersPagination.page);

            } catch (error) {
                console.error('Error deleting user:', error);
                alert('❌ Error deleting user: ' + error.message);
            }
        }

        // ========================================
        // Posts Section
        // ========================================

        async function loadPosts(page = 0) {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/admin/posts?page=${page}&size=${ITEMS_PER_PAGE}`,
                    {
                        credentials: 'include',
                        headers: authHeaders({ 'Accept': 'application/json' })
                    }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                postsPagination.page = data.page;
                postsPagination.total = data.totalPages;

                let html = '<table><thead><tr><th>ID</th><th>Author</th><th>Content</th><th>Status</th><th>Actions</th></tr></thead><tbody>';

                data.posts.forEach(post => {
                    const status = post.deleted ? '🗑️ Deleted' : '✅ Active';
                    let displayContent = '';
                    
                    if (post.postType === 'IMAGE') {
                        const imgSrc = post.imageUrl || post.content || '';
                        displayContent = `<img src="${imgSrc}" style="max-width: 100px; max-height: 100px; border-radius: 4px;" alt="Post Image"/>`;
                    } else if (post.postType === 'CODE') {
                        const codeText = post.content || '';
                        const escapedCode = codeText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        displayContent = `<pre class="code-block"><code>${escapedCode}</code></pre>`;
                    } else {
                        displayContent = post.content ? post.content.substring(0, 50) + '...' : 'N/A';
                    }

                    html += `<tr>
                        <td>${post.id}</td>
                        <td>${post.author || 'Unknown'}</td>
                        <td>${displayContent}</td>
                        <td>${status}</td>
                        <td>
                            <button class="action-button primary" onclick="viewPost(${post.id})">View</button>
                            <button class="action-button delete" onclick="deletePost(${post.id})">Delete</button>
                        </td>
                    </tr>`;
                });

                html += '</tbody></table>';

                // Add pagination
                html += '<div class="pagination">';
                for (let i = 0; i < postsPagination.total; i++) {
                    const activeClass = i === postsPagination.page ? 'active' : '';
                    html += `<button class="${activeClass}" onclick="loadPosts(${i})">${i + 1}</button>`;
                }
                html += '</div>';

                document.getElementById('posts-content').innerHTML = html;

            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('posts-content').innerHTML = 
                    `<div class="error-message">Error loading posts: ${error.message}</div>`;
            }
        }

        async function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/posts/${postId}`, {
                    method: 'DELETE',
                    credentials: 'include',
                    headers: authHeaders({ 'Content-Type': 'application/json' })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                alert('✅ Post deleted successfully');
                loadPosts(postsPagination.page);

            } catch (error) {
                console.error('Error deleting post:', error);
                alert('❌ Error deleting post: ' + error.message);
            }
        }

        async function viewPost(postId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/posts/${postId}`, {
                    credentials: 'include',
                    headers: authHeaders({ 'Accept': 'application/json' })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const post = await response.json();

                let modalContent = `
                    <h2>📄 Post Details</h2>
                    <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
                    
                    <div style="margin-bottom: 20px;">
                        <p><strong>ID:</strong> ${post.id}</p>
                        <p><strong>Author:</strong> ${post.author || 'Unknown'}</p>
                        <p><strong>Status:</strong> ${post.deleted ? '🗑️ Deleted' : '✅ Active'}</p>
                        <p><strong>Created:</strong> ${new Date(post.createdAt).toLocaleString()}</p>
                    </div>
                    
                    <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
                `;

                // Display image if present
                if (post.imageUrl || (post.postType === 'IMAGE' && post.content)) {
                    const imgSrc = post.imageUrl || post.content;
                    modalContent += `
                        <div style="margin-bottom: 20px;">
                            <h3>🖼️ Image</h3>
                            <img src="${imgSrc}" style="max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px;" alt="Post Image" onerror="this.src='/images/placeholder.png';"/>
                        </div>
                        <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
                    `;
                }

                // Display text content if present
                if (post.content && post.postType !== 'IMAGE' && post.postType !== 'CODE') {
                    modalContent += `
                        <div style="margin-bottom: 20px;">
                            <h3>📝 Content</h3>
                            <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; word-wrap: break-word; white-space: pre-wrap;">
                                ${post.content.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                            </div>
                        </div>
                        <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
                    `;
                }

                // Display code if present
                if (post.postType === 'CODE' && post.content) {
                    const codeText = post.content.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    modalContent += `
                        <div style="margin-bottom: 20px;">
                            <h3>💻 Code</h3>
                            <pre style="background: #2d2d2d; color: #f8f8f2; padding: 15px; border-radius: 8px; overflow-x: auto;"><code>${codeText}</code></pre>
                        </div>
                        <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
                    `;
                }

                // Display URL/Link if present
                if (post.linkUrl) {
                    const linkText = post.linkUrl.length > 50 ? post.linkUrl.substring(0, 50) + '...' : post.linkUrl;
                    modalContent += `
                        <div style="margin-bottom: 20px;">
                            <h3>🔗 Link</h3>
                            <a href="${post.linkUrl}" target="_blank" style="color: #667eea; text-decoration: none; word-break: break-all;">${linkText}</a>
                        </div>
                    `;
                }

                document.getElementById('postModalContent').innerHTML = modalContent;
                document.getElementById('postModal').style.display = 'flex';

            } catch (error) {
                console.error('Error loading post details:', error);
                alert('❌ Error loading post details: ' + error.message);
            }
        }

        function closePostModal() {
            document.getElementById('postModal').style.display = 'none';
        }

        // ========================================
        // Reports Section
        // ========================================

        async function loadReports() {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/admin/reports?status=all`,
                    {
                        credentials: 'include',
                        headers: authHeaders({ 'Accept': 'application/json' })
                    }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                if (!data.reports || data.reports.length === 0) {
                    document.getElementById('reports-content').innerHTML = 
                        '<div class="empty-state"><p>No reports found</p></div>';
                    return;
                }

                let html = `<p>📌 <strong>${data.pendingCount}</strong> pending reports</p>`;
                html += '<table><thead><tr><th>ID</th><th>Post Author</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead><tbody>';

                data.reports.forEach(report => {
                    const statusClass = {
                        'PENDING': 'pending',
                        'APPROVED': 'approved',
                        'REMOVED': 'deleted'
                    }[report.status] || 'pending';
                    
                    html += `<tr>
                        <td>${report.id}</td>
                        <td>${report.postAuthor || 'Unknown'}</td>
                        <td>${report.reason || 'Other'}</td>
                        <td><span class="badge ${statusClass}">${report.status}</span></td>
                        <td>
                            <button class="action-button primary" onclick="ignoreReport(${report.id})">Ignore</button>
                            <button class="action-button delete" onclick="removePost(${report.id})">Remove</button>
                        </td>
                    </tr>`;
                });

                html += '</tbody></table>';
                document.getElementById('reports-content').innerHTML = html;

            } catch (error) {
                console.error('Error loading reports:', error);
                document.getElementById('reports-content').innerHTML = 
                    `<div class="error-message">Error loading reports: ${error.message}</div>`;
            }
        }

        async function ignoreReport(reportId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/reports/${reportId}/ignore`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: authHeaders({ 'Content-Type': 'application/json' })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                alert('✅ Report ignored');
                loadReports();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function removePost(reportId) {
            if (!confirm('This will remove the post. Continue?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/reports/${reportId}/remove`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: authHeaders({ 'Content-Type': 'application/json' })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                alert('✅ Post removed');
                loadReports();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ========================================
        // Analytics Section
        // ========================================

        async function loadAnalytics() {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/admin/stats?days=7`,
                    {
                        credentials: 'include',
                        headers: authHeaders({ 'Accept': 'application/json' })
                    }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                let html = `<table><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>`;
                html += `<tr><td>Total Users</td><td><strong>${data.totalUsers}</strong></td></tr>`;
                html += `<tr><td>Total Posts</td><td><strong>${data.totalPosts}</strong></td></tr>`;
                html += `<tr><td>Active Users (7 days)</td><td><strong>${data.activeUsersWindow}</strong></td></tr>`;
                html += `<tr><td>New Posts (24 hours)</td><td><strong>${data.newPosts24h}</strong></td></tr>`;
                html += `</tbody></table>`;

                document.getElementById('analytics-content').innerHTML = html;

            } catch (error) {
                console.error('Error loading analytics:', error);
                document.getElementById('analytics-content').innerHTML = 
                    `<div class="error-message">Error loading analytics: ${error.message}</div>`;
            }
        }

        // ========================================
        // Utility Functions
        // ========================================

        function showError(title, message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `
                <div class="error-message">
                    <strong>${title}</strong><br>
                    ${message}
                </div>
            `;
            document.getElementById('loading-container').style.display = 'none';
        }

        function redirectToLogin() {
            setTimeout(() => {
                window.location.href = `${API_BASE_URL}/api/auth/login`;
            }, 2000);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = `${API_BASE_URL}/api/auth/logout`;
            }
        }

        // Close modal when clicking outside of it
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('postModal');
            if (event.target === modal) {
                closePostModal();
            }
        });
    </script>

    <!-- Post Detail Modal -->
    <div id="postModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px;">
        <div style="background: white; border-radius: 10px; max-width: 700px; max-height: 80vh; overflow-y: auto; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative;">
            <button onclick="closePostModal()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 28px; cursor: pointer; color: #999; font-weight: normal; padding: 0; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;">×</button>
            <div id="postModalContent"></div>
        </div>
    </div>
</body>
</html>
